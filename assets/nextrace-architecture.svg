<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">NexTrace AI sistem mimarisi</title>
  <desc id="desc">Mühendislik veri kaynaklarından bağlayıcı ve normalizasyon katmanına, izlenebilirlik grafiğine, etki motoruna ve sonuç arayüzlerine uzanan güvenli veri akışı.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081521"/><stop offset="1" stop-color="#0c1d2d"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123944"/><stop offset="1" stop-color="#10253a"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#527793"/></marker>
    <style>
      .band{fill:#0a1724;stroke:#284158;stroke-width:1.5;rx:18}.box{fill:#0e2031;stroke:#36546c;stroke-width:1.5;rx:12}.box2{fill:url(#core);stroke:#28d8c3;stroke-width:2;rx:14}.label{fill:#7892a9;font:600 15px 'Segoe UI',Arial,sans-serif;letter-spacing:1.8px}.title{fill:#f1f7fd;font:650 21px 'Segoe UI',Arial,sans-serif}.text{fill:#a9bfd2;font:15px 'Segoe UI',Arial,sans-serif}.small{fill:#7892a9;font:13px 'Cascadia Code',Consolas,monospace}.accent{fill:#72efe0}.edge{fill:none;stroke:#527793;stroke-width:2;marker-end:url(#arrow)}.edge2{fill:none;stroke:#28d8c3;stroke-width:2.3;marker-end:url(#arrow)}.dot{fill:#28d8c3;filter:url(#glow)}
    </style>
  </defs>
  <rect width="1600" height="800" rx="24" fill="url(#bg)"/>
  <path d="M0 88H1600" stroke="#20364b"/>
  <text x="54" y="54" class="title">NexTrace AI</text>
  <text x="202" y="54" class="text">Açıklanabilir değişiklik etki analizi — referans mimari</text>
  <text x="1518" y="54" text-anchor="end" class="small">v0.3 · 2026</text>

  <rect x="42" y="126" width="264" height="542" class="band"/>
  <text x="66" y="160" class="label">MÜHENDİSLİK KAYNAKLARI</text>
  <g>
    <rect x="66" y="190" width="216" height="82" class="box"/><circle cx="89" cy="213" r="5" class="dot"/><text x="106" y="219" class="title">Gereksinimler</text><text x="106" y="245" class="small">Jira · DOORS</text>
    <rect x="66" y="298" width="216" height="82" class="box"/><circle cx="89" cy="321" r="5" class="dot"/><text x="106" y="327" class="title">Yazılım</text><text x="106" y="353" class="small">GitLab · GitHub</text>
    <rect x="66" y="406" width="216" height="82" class="box"/><circle cx="89" cy="429" r="5" class="dot"/><text x="106" y="435" class="title">Test</text><text x="106" y="461" class="small">TestRail · CI/CD</text>
    <rect x="66" y="514" width="216" height="82" class="box"/><circle cx="89" cy="537" r="5" class="dot"/><text x="106" y="543" class="title">Doküman</text><text x="106" y="569" class="small">SharePoint · PDF</text>
  </g>

  <path d="M282 231H350" class="edge"/><path d="M282 339H350" class="edge"/><path d="M282 447H350" class="edge"/><path d="M282 555H350" class="edge"/>

  <rect x="350" y="162" width="286" height="470" class="band"/>
  <text x="374" y="196" class="label">BAĞLAYICI VE NORMALİZASYON</text>
  <rect x="374" y="226" width="238" height="78" class="box"/><text x="397" y="258" class="title">Kaynak adaptörleri</text><text x="397" y="282" class="small">API · webhook · dosya</text>
  <path d="M493 304V337" class="edge"/>
  <rect x="374" y="337" width="238" height="92" class="box"/><text x="397" y="369" class="title">Kanonik veri modeli</text><text x="397" y="393" class="text">Kimlik · sürüm · ilişki</text><text x="397" y="414" class="text">kaynak · zaman damgası</text>
  <path d="M493 429V462" class="edge"/>
  <rect x="374" y="462" width="238" height="92" class="box"/><text x="397" y="494" class="title">Kalite kapısı</text><text x="397" y="518" class="text">Şema doğrulama</text><text x="397" y="539" class="text">Çakışma ve eksik bağ tespiti</text>
  <text x="493" y="594" text-anchor="middle" class="small">Kaynak sistem değiştirilmez</text>

  <path d="M636 397H704" class="edge2"/>

  <rect x="704" y="184" width="306" height="426" class="box2"/>
  <text x="857" y="224" text-anchor="middle" class="label accent">NEXTRACE CORE</text>
  <rect x="742" y="254" width="230" height="112" class="box"/><text x="857" y="289" text-anchor="middle" class="title">İzlenebilirlik grafiği</text><text x="857" y="317" text-anchor="middle" class="text">Gereksinim ↔ kod ↔ test</text><text x="857" y="342" text-anchor="middle" class="small">sürümlü ilişki deposu</text>
  <path d="M857 366V402" class="edge2"/>
  <rect x="742" y="402" width="230" height="142" class="box"/><text x="857" y="438" text-anchor="middle" class="title">Etki analizi motoru</text><text x="857" y="466" text-anchor="middle" class="text">Graf tarama + kurallar</text><text x="857" y="491" text-anchor="middle" class="text">Risk puanı + ML desteği</text><text x="857" y="518" text-anchor="middle" class="small">kanıt yolu üretimi</text>
  <circle cx="727" cy="397" r="5" class="dot"/><circle cx="987" cy="397" r="5" class="dot"/>

  <path d="M1010 397H1078" class="edge2"/>

  <rect x="1078" y="148" width="254" height="498" class="band"/>
  <text x="1102" y="182" class="label">GÜVEN VE YÖNETİŞİM</text>
  <rect x="1102" y="214" width="206" height="72" class="box"/><text x="1124" y="247" class="title">Erişim kontrolü</text><text x="1124" y="269" class="small">RBAC · MFA</text>
  <rect x="1102" y="310" width="206" height="72" class="box"/><text x="1124" y="343" class="title">Veri güvenliği</text><text x="1124" y="365" class="small">şifreleme · maskeleme</text>
  <rect x="1102" y="406" width="206" height="72" class="box"/><text x="1124" y="439" class="title">Denetim günlüğü</text><text x="1124" y="461" class="small">değiştirilemez kayıt</text>
  <rect x="1102" y="502" width="206" height="72" class="box"/><text x="1124" y="535" class="title">Kurulum seçeneği</text><text x="1124" y="557" class="small">özel bulut · on-prem</text>
  <text x="1205" y="612" text-anchor="middle" class="small">KVKK ve ticari sır odaklı</text>

  <path d="M1332 397H1392" class="edge"/>

  <rect x="1392" y="180" width="166" height="430" class="band"/>
  <text x="1416" y="214" class="label">ÇIKTILAR</text>
  <rect x="1416" y="246" width="118" height="68" class="box"/><text x="1475" y="275" text-anchor="middle" class="title">Çalışma</text><text x="1475" y="297" text-anchor="middle" class="small">alanı</text>
  <rect x="1416" y="338" width="118" height="68" class="box"/><text x="1475" y="367" text-anchor="middle" class="title">REST API</text><text x="1475" y="389" text-anchor="middle" class="small">entegrasyon</text>
  <rect x="1416" y="430" width="118" height="68" class="box"/><text x="1475" y="459" text-anchor="middle" class="title">Kanıt</text><text x="1475" y="481" text-anchor="middle" class="small">raporu</text>
  <rect x="1416" y="522" width="118" height="56" class="box"/><text x="1475" y="556" text-anchor="middle" class="title">Uyarı</text>

  <path d="M44 714H1556" stroke="#20364b"/>
  <text x="54" y="752" class="small">AKIŞ</text>
  <text x="118" y="752" class="text">Kaynak bağla</text><path d="M229 746h47" class="edge"/>
  <text x="294" y="752" class="text">Normalleştir</text><path d="M406 746h47" class="edge"/>
  <text x="471" y="752" class="text">İlişkiyi sürümle</text><path d="M600 746h47" class="edge"/>
  <text x="665" y="752" class="text">Etkiyi puanla</text><path d="M780 746h47" class="edge"/>
  <text x="845" y="752" class="text">Kanıtı göster</text><path d="M957 746h47" class="edge"/>
  <text x="1022" y="752" class="text">Uzman onayı</text><path d="M1127 746h47" class="edge"/>
  <text x="1192" y="752" class="text">Raporla</text>
</svg>
